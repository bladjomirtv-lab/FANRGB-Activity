<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>FANRGB Activity</title>
  <link rel="manifest" href="manifest.webmanifest">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#070b14;--card:#0e1526;--muted:#8e9bb2;--text:#f4f7fb;--line:#23304a;--good:#40d17a;--bad:#ff5d73;--warn:#ffc857;--accent:#7aa2ff}*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#070b14,#0b1220 45%,#070b14);color:var(--text)}main{width:min(1100px,100%);margin:0 auto;padding:18px 14px 36px}header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}h1{font-size:1.3rem;margin:0}.live{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.9rem}.dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:rgba(14,21,38,.92);border:1px solid var(--line);border-radius:16px;padding:14px}.label{color:var(--muted);font-size:.78rem}.value{font-size:1.55rem;font-weight:700;margin-top:4px}.small{color:var(--muted);font-size:.78rem;margin-top:4px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}button{border:1px solid var(--line);background:#0d1527;color:var(--text);border-radius:10px;padding:7px 10px}button.active{border-color:var(--accent);color:#fff}.chart-card{height:310px}.feed{margin-top:12px}.event{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid rgba(35,48,74,.7);font-size:.88rem}.event:last-child{border-bottom:none}.time,.meta{color:var(--muted)}.badge{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:3px 7px;white-space:nowrap}.success{color:var(--good)}.failure{color:var(--bad)}.running{color:var(--warn)}footer{color:var(--muted);font-size:.75rem;margin-top:14px;text-align:center}@media(min-width:720px){.cards{grid-template-columns:repeat(6,minmax(0,1fr))}.chart-card{height:390px}}</style>
</head>
<body><main>
<header><div><h1>FANRGB Activity</h1><div class="small" id="repo">GitHub activity dashboard</div></div><div class="live"><span class="dot"></span><span id="freshness">lädt…</span></div></header>
<section class="cards">
<div class="card"><div class="label">Events · 60 Min.</div><div class="value" id="events60">–</div></div>
<div class="card"><div class="label">Commits heute</div><div class="value" id="commitsToday">–</div></div>
<div class="card"><div class="label">Runs heute</div><div class="value" id="runsToday">–</div></div>
<div class="card"><div class="label">Laufend</div><div class="value running" id="running">–</div></div>
<div class="card"><div class="label">Erfolgreich</div><div class="value success" id="success">–</div></div>
<div class="card"><div class="label">Fehler</div><div class="value failure" id="failure">–</div></div>
</section>
<div class="toolbar" id="ranges"><button data-range="1h">1h</button><button data-range="6h">6h</button><button data-range="24h" class="active">24h</button><button data-range="7d">7d</button><button data-range="30d">30d</button><button data-range="90d">90d</button><button data-range="all">Gesamt</button></div>
<section class="card chart-card"><canvas id="activityChart"></canvas></section>
<section class="card feed"><div class="label">Aktuelle Aktivität</div><div id="feed"></div></section>
<footer>Automatische Aktualisierung alle 60 Sekunden · ausschließlich bereinigte Telemetrie</footer>
</main><script>
const DATA_URL='./data/activity.json';let currentRange='24h',chart,dataset;
function relTime(ts){const sec=Math.max(0,Math.round((Date.now()-new Date(ts).getTime())/1000));if(sec<60)return`vor ${sec}s`;if(sec<3600)return`vor ${Math.floor(sec/60)}m`;if(sec<86400)return`vor ${Math.floor(sec/3600)}h`;return`vor ${Math.floor(sec/86400)}d`}
function cls(v=''){v=v.toLowerCase();return v.includes('success')?'success':v.includes('fail')?'failure':(v.includes('progress')||v.includes('running')||v.includes('queued'))?'running':''}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fmtLabel(v){const d=new Date(v);return currentRange.includes('h')?d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}
function render(data){dataset=data;document.getElementById('repo').textContent=data.repo||'FANRGB';document.getElementById('freshness').textContent=data.generated_at?`aktualisiert ${relTime(data.generated_at)}`:'keine Daten';for(const[id,key]of Object.entries({events60:'events_last_60m',commitsToday:'commits_today',runsToday:'runs_today',running:'running',success:'success_today',failure:'failure_today'}))document.getElementById(id).textContent=data.summary?.[key]??0;renderChart();const feed=document.getElementById('feed');feed.innerHTML=(data.recent||[]).slice(0,20).map(e=>`<div class="event"><div class="time">${new Date(e.ts).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div><div><div>${esc(e.title||e.kind||'Event')}</div><div class="meta">${esc(e.meta||'')}</div></div><span class="badge ${cls(e.status)}">${esc(e.status||e.kind||'event')}</span></div>`).join('')||'<div class="small" style="padding-top:12px">Noch keine aktuellen Telemetriedaten.</div>'}
function renderChart(){const points=dataset?.series?.[currentRange]||[];const config={type:'line',data:{labels:points.map(p=>fmtLabel(p.t)),datasets:[{label:'Aktivität',data:points.map(p=>p.activity||0),tension:.28,fill:true},{label:'Fehler',data:points.map(p=>p.failures||0),tension:.2,fill:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#cbd5e1'}}},scales:{x:{ticks:{color:'#8e9bb2',maxTicksLimit:10},grid:{color:'rgba(35,48,74,.35)'}},y:{beginAtZero:true,ticks:{precision:0,color:'#8e9bb2'},grid:{color:'rgba(35,48,74,.35)'}}}}};if(chart)chart.destroy();chart=new Chart(document.getElementById('activityChart'),config)}
async function load(){try{const r=await fetch(`${DATA_URL}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);render(await r.json())}catch(e){document.getElementById('freshness').textContent='Daten nicht erreichbar'}}
document.getElementById('ranges').addEventListener('click',e=>{if(!e.target.dataset.range)return;currentRange=e.target.dataset.range;document.querySelectorAll('#ranges button').forEach(b=>b.classList.toggle('active',b===e.target));renderChart()});load();setInterval(load,60000);
</script></body></html>
